<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Smart Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="app-bar">
      <h3 class="mdl-shadow--4dp">📚 Smart Study Planner</h3>
    </div>
    <div class="planner-container mdl-shadow--2dp">
      <form id="task-form">
        <div class="form-layout">
          <div class="input-grid">

            <div class="input-row">
              <!-- Subject -->
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <label class="mdl-textfield__label" for="subject">Subject</label>
                <input class="mdl-textfield__input" type="text" id="subject" placeholder="Operating System" required />
              </div>

              <!-- Topic -->
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <label class="mdl-textfield__label" for="topic">Topic</label>
                <input class="mdl-textfield__input" type="text" id="topic" placeholder="Scheduling" required />
              </div>
            </div>

            <div class="input-row">
              <!-- Date -->
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <label class="mdl-textfield__label" for="task-date">Date</label>
                <input class="mdl-textfield__input" type="date" id="task-date" required />
              </div>

              <!-- Time -->
              <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <label class="mdl-textfield__label" for="task-time">Time</label>
                <input class="mdl-textfield__input" type="time" id="task-time" required />
              </div>
            </div>

          </div>

          <div class="add-btn-container">
            <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored">
              <i class="material-icons">add</i>
            </button>
          </div>
        </div>
      </form>
      <section id="task-list"></section>
    </div>
  </main>
  <script src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <script src="./script.js"></script>
</body>

</html>
