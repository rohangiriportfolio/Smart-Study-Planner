<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Smart Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="app-bar">
      <h3 class="mdl-shadow--4dp">📚 Smart Study Planner</h3>
    </div>
    <div class="planner-container mdl-shadow--2dp">
      <form id="task-form" class="task-form">
        <div class="form-layout">
          <!-- 2x2 Grid -->
          <div class="input-grid">
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="text" id="subject" required />
              <label class="mdl-textfield__label label_1" for="subject">Subject</label>
            </div>

            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="text" id="topic" required />
              <label class="mdl-textfield__label label_1" for="topic">Topic</label>
            </div>

            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="date" id="task-date" required />
              <label class="mdl-textfield__label label_2" for="task-date">Date</label>
            </div>

            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="time" id="task-time" required />
              <label class="mdl-textfield__label label_2" for="task-time">Time</label>
            </div>
          </div>

          <!-- Plus Button -->
          <div class="add-btn-container">
            <button type="submit" class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored"
              aria-label="Add Task">
              <i class="material-icons">add</i>
            </button>
          </div>
        </div>
      </form>

      <section id="task-list"></section>
    </div>
  </main>

  <script src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
